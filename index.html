<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Shield - Under Construction</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.5;
        padding: 2rem;
        max-width: 60ch;
        margin: 0 auto;
        color: #333;
      }
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #000;
        color: white;
        padding: 8px;
        z-index: 100;
        transition: transform 0.2s;
      }
      .skip-link:focus {
        top: 0;
        transform: translateY(0);
      }
      main {
        outline: none;
      }
      button {
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      button:hover:not(:disabled) {
        background: #1d4ed8;
      }
      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .spinner {
        width: 1em;
        height: 1em;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      button.success:disabled {
        background-color: #15803d;
        color: white;
        opacity: 1;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="status-message" role="status" class="sr-only"></div>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
      <h1>Legal Shield</h1>
    </header>

    <main id="main-content" tabindex="-1">
      <p>This site is currently under construction. Please check back later.</p>

      <button id="notify-btn" type="button">Notify me</button>
    </main>

    <script>
      const btn = document.getElementById('notify-btn');

      btn.addEventListener('click', () => {
        // Set loading state
        btn.disabled = true;
        btn.setAttribute('aria-busy', 'true');
        btn.innerHTML =
          '<span class="spinner" aria-hidden="true"></span> Notifying...';

        // Simulate async request
        setTimeout(() => {
          btn.removeAttribute('aria-busy');
          btn.classList.add('success');
          btn.innerHTML = '✅ Subscribed!';
          // Keeping aria-label for completeness, though status message handles announcement
          btn.setAttribute('aria-label', 'Successfully subscribed');

          // Announce to screen readers using a live region
          document.getElementById('status-message').textContent =
            'Successfully subscribed!';
        }, 1500);
      });
    </script>
  </body>
</html>
