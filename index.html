<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Shield - Under Construction</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        line-height: 1.5;
        padding: 2rem;
        max-width: 60ch;
        margin: 0 auto;
        color: #333;
      }
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #000;
        color: white;
        padding: 8px;
        z-index: 100;
        transition: transform 0.2s;
      }
      .skip-link:focus {
        top: 0;
        transform: translateY(0);
      }
      main {
        outline: none;
      }

      /* Form Styles */
      .notify-form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-top: 2rem;
        max-width: 400px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .error-message {
        color: #dc2626;
        font-size: 0.875rem;
      }

      .error-message:not(:empty) {
        margin-top: 0.25rem;
      }

      input[aria-invalid='true'] {
        border-color: #dc2626;
      }

      input[aria-invalid='true']:focus-visible {
        outline-color: #dc2626;
        border-color: #dc2626;
      }

      label {
        font-weight: 500;
        font-size: 0.9rem;
        color: #4b5563;
      }

      input,
      button {
        font-family: inherit;
        font-size: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid #d1d5db;
      }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
        border-color: #2563eb;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.2s;
      }

      button:hover:not(:disabled) {
        background: #1d4ed8;
      }

      button:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }

      .status-message {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 6px;
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
        display: none; /* Hidden by default */
        animation: fadeIn 0.3s ease-in;
      }

      .status-message.visible {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .success-icon {
        color: #059669;
        flex-shrink: 0;
        animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .spinner {
        display: inline-block;
        width: 1em;
        height: 1em;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
        margin-right: 0.5rem;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes scaleIn {
        from {
          transform: scale(0);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
      <h1>Legal Shield</h1>
    </header>

    <main id="main-content" tabindex="-1">
      <p>
        This site is currently under construction. We're building something
        great!
      </p>
      <p>Sign up to get notified when we launch.</p>

      <form id="notify-form" class="notify-form" novalidate>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="name@example.com"
            autocomplete="email"
            aria-describedby="email-error"
          />
          <div id="email-error" class="error-message" aria-live="polite"></div>
        </div>
        <button type="submit" id="submit-btn">Notify me</button>
      </form>

      <div
        id="status-message"
        class="status-message"
        role="status"
        aria-live="polite"
        tabindex="-1"
      ></div>
    </main>

    <script>
      const form = document.getElementById('notify-form');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('submit-btn');
      const statusMessage = document.getElementById('status-message');
      const emailError = document.getElementById('email-error');

      function clearError() {
        emailInput.removeAttribute('aria-invalid');
        emailError.textContent = '';
      }

      emailInput.addEventListener('input', () => {
        if (emailInput.hasAttribute('aria-invalid')) {
          clearError();
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Custom accessible validation
        if (!emailInput.validity.valid) {
          emailInput.setAttribute('aria-invalid', 'true');
          emailError.textContent = emailInput.validationMessage;
          emailInput.focus();
          return;
        }

        // Loading state
        submitBtn.disabled = true;
        const originalContent = submitBtn.innerHTML;
        submitBtn.innerHTML =
          '<span class="spinner" aria-hidden="true"></span> Sending...';

        // Simulate network request
        setTimeout(() => {
          // Success state
          form.style.display = 'none';

          // Create success content with icon
          statusMessage.innerHTML = '';

          const icon = document.createElement('div');
          icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="success-icon" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

          const text = document.createElement('span');
          text.textContent =
            "Thanks! We've added " + emailInput.value + ' to our list.';

          statusMessage.appendChild(icon.firstElementChild);
          statusMessage.appendChild(text);

          statusMessage.classList.add('visible');
          statusMessage.focus();

          // Reset button (though form is hidden)
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalContent;
        }, 1500);
      });
    </script>
  </body>
</html>
