<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Shield - Under Construction</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: 2rem;
      max-width: 60ch;
      margin: 0 auto;
      color: #333;
    }
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #000;
      color: white;
      padding: 8px;
      z-index: 100;
    }
    .skip-link:focus {
      top: 0;
    }
    main {
      outline: none;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: #2563eb;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    .btn-primary:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-success {
      background-color: #15803d !important;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background-color: #14532d;
    }

    .btn-success:focus-visible {
      outline-color: #15803d;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }

    .icon {
      width: 1.25em;
      height: 1.25em;
      margin-right: 0.5em;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Legal Shield</h1>
  </header>

  <main id="main-content" tabindex="-1">
    <p>This site is currently under construction. Please check back later.</p>

    <button id="notify-btn" class="btn-primary" aria-label="Subscribe for updates">Notify me</button>
    <div id="status-message" class="sr-only" role="status"></div>
  </main>

  <script>
    document.getElementById('notify-btn').addEventListener('click', function(e) {
      const btn = e.target;
      const status = document.getElementById('status-message');

      // Prevent double submission
      if (btn.disabled) return;

      // Loading state
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Sending...';
      btn.setAttribute('aria-busy', 'true');
      status.textContent = 'Sending subscription request...';

      // Simulate network request
      setTimeout(() => {
        btn.classList.add('btn-success');
        btn.innerHTML = `
          <svg class="icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
          Subscribed!
        `;
        btn.setAttribute('aria-busy', 'false');
        btn.setAttribute('aria-label', 'Successfully subscribed');
        status.textContent = 'Successfully subscribed';

        // Reset after a while
        setTimeout(() => {
          btn.disabled = false;
          btn.classList.remove('btn-success');
          btn.textContent = originalText;
          btn.setAttribute('aria-label', 'Subscribe for updates');
          status.textContent = '';
        }, 3000);
      }, 1500);
    });
  </script>
</body>
</html>
