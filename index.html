<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Shield - Under Construction</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: 2rem;
      max-width: 60ch;
      margin: 0 auto;
      color: #333;
    }
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #000;
      color: white;
      padding: 8px;
      z-index: 100;
    }
    .skip-link:focus {
      top: 0;
    }
    main {
      outline: none;
    }

    .btn-notify {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn-notify:hover {
      opacity: 0.8;
    }

    .btn-notify:focus-visible {
      outline: 2px solid #333;
      outline-offset: 2px;
    }

    .btn-notify:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Legal Shield</h1>
  </header>

  <main id="main-content" tabindex="-1">
    <p>This site is currently under construction. Please check back later.</p>

    <button type="button" class="btn-notify" id="notify-btn" aria-label="Subscribe for updates">Notify me</button>
  </main>

  <script>
    document.getElementById('notify-btn').addEventListener('click', function() {
      const btn = this;
      btn.disabled = true;
      btn.textContent = 'Subscribing...';

      // Simulate API call
      setTimeout(() => {
        btn.textContent = 'Thanks!';
        btn.setAttribute('aria-label', 'Successfully subscribed');
      }, 1000);
    });
  </script>
</body>
</html>
