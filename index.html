<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Shield - Under Construction</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding: 2rem;
      max-width: 60ch;
      margin: 0 auto;
      color: #333;
    }
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #000;
      color: white;
      padding: 8px;
      z-index: 100;
    }
    .skip-link:focus {
      top: 0;
    }
    main {
      outline: none;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: #2563eb;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: #1d4ed8;
    }
    .btn-primary:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1>Legal Shield</h1>
  </header>

  <main id="main-content" tabindex="-1">
    <p>This site is currently under construction. Please check back later.</p>

    <button id="notify-btn" class="btn-primary" aria-label="Subscribe for updates">Notify me</button>
  </main>

  <script>
    document.getElementById('notify-btn').addEventListener('click', function(e) {
      const btn = e.target;

      // Prevent double submission
      if (btn.disabled) return;

      // Loading state
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Sending...';
      btn.setAttribute('aria-busy', 'true');

      // Simulate network request
      setTimeout(() => {
        btn.textContent = 'Subscribed!';
        btn.setAttribute('aria-busy', 'false');
        btn.setAttribute('aria-label', 'Successfully subscribed');

        // Reset after a while
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = originalText;
          btn.setAttribute('aria-label', 'Subscribe for updates');
        }, 3000);
      }, 1500);
    });
  </script>
</body>
</html>
